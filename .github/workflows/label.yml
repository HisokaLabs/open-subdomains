name: label

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const wanted = [];
            const add = (label, test) => {
              if (files.some((f) => test(f.filename)) && !wanted.includes(label)) {
                wanted.push(label);
              }
            };

            add('subdomain', (f) => f.startsWith('domains/'));
            add('scripts', (f) => f.startsWith('scripts/') || f === 'package.json');
            add('ci', (f) => f.startsWith('.github/'));
            add('docs', (f) => f.endsWith('.md'));

            if (!wanted.length) {
              return;
            }

            const existing = new Set(
              (await github.paginate(github.rest.issues.listLabelsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              })).map((l) => l.name)
            );

            for (const name of wanted) {
              if (!existing.has(name)) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: wanted,
            });
