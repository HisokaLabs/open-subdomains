name: registry-comment

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'domains/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: registry-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: Explain what the registry check needs
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Take the pull request's entries, keep the registry's own rules
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "pull/${PR_NUMBER}/head:prhead"
          # Only regular .json files are copied, so a symlinked entry cannot
          # make this runner read a path outside the checkout.
          changed=$(git diff --name-only --no-renames "${{ github.event.pull_request.base.sha }}...prhead" -- domains/ | grep -E '^domains/[^/]+\.json$' || true)
          if [ -z "$changed" ]; then
            echo 'this PR changes nothing under domains/'
          fi
          for file in $changed; do
            if git cat-file -e "prhead:$file" 2>/dev/null; then
              mkdir -p "$(dirname "$file")"
              git show "prhead:$file" > "$file"
              echo "took $file from the pull request"
            else
              rm -f "$file"
              echo "removed $file, as the pull request does"
            fi
          done
          # The maintainer-owned files always come from the base branch.
          git checkout HEAD -- domains/_meta.json domains/SCHEMA.json domains/_example.json

      - name: Decide what to report
        id: build
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > /tmp/changed.txt || true
          CHANGED_FILES="$(cat /tmp/changed.txt)" \
            node scripts/pr-report.js > /tmp/comment.md && verdict=pass || verdict=fail
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          cat /tmp/comment.md

      - name: Upsert the report comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERDICT: ${{ steps.build.outputs.verdict }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- registry-validator -->';
            const body = fs.readFileSync('/tmp/comment.md', 'utf8');
            if (!body.includes(marker)) {
              core.setFailed('report is missing its marker, refusing to comment');
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              if (existing.body === body) {
                core.info('comment already up to date');
                return;
              }
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`updated comment ${existing.id}`);
              return;
            }

            if (process.env.VERDICT === 'pass') {
              core.info('nothing to report and no comment to update');
              return;
            }

            const created = await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info(`created comment ${created.data.id}`);
