name: check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: filter
        name: Decide what to validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != 'pull_request' ]; then
            echo "registry=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          touched=false
          if files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>/dev/null); then
            if echo "$files" | grep -qE '^(domains/|scripts/|test/|dnsconfig\.js|package\.json|.*\.json$)'; then
              touched=true
            fi
          else
            touched=true
          fi
          echo "registry=$touched" >> "$GITHUB_OUTPUT"
          if [ "$touched" = 'false' ]; then
            echo 'No registry-relevant files changed, so nothing to validate.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.filter.outputs.registry == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - if: steps.filter.outputs.registry == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - if: steps.filter.outputs.registry == 'true'
        name: Validate domains/*.json
        run: npm run check

      - if: steps.filter.outputs.registry == 'true'
        name: Run the validator test suite
        run: npm test

      - if: steps.filter.outputs.registry == 'true' && github.event_name == 'pull_request'
        name: Verify entry owners match the PR author
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: npm run verify-owners

      - if: steps.filter.outputs.registry == 'true'
        name: DNSControl check
        uses: HisokaLabs/dnscontrol-actions@v4
        with:
          args: check
