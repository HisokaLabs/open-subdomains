name: check

# Validates every domains/*.json entry against the registry rules. No
# credentials needed. This is the fast gate that fails a bad PR early.

on:
  pull_request:
    paths:
      - 'domains/**'
      - 'dnsconfig.js'
      - 'scripts/**'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'domains/**'
      - 'dnsconfig.js'
      - 'scripts/**'
      - 'package.json'

jobs:
  validate:
    name: Validate registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history so verify-owners can diff the PR against its base branch.
      # A shallow clone would silently fall back to checking every file.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate domains/*.json
        run: npm run check

      # Every entry must be owned by the person opening the PR. Skipped on push
      # and locally, where PR_AUTHOR is unset.
      - name: Verify entry owners match the PR author
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: npm run verify-owners

      - name: DNSControl check
        uses: HisokaLabs/dnscontrol-actions@v4
        with:
          args: check
