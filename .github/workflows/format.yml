name: format

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Check the pull request shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      # npm ci rather than npm install: it installs exactly what the lockfile
      # pins, so a changed transitive dependency cannot slip into the checks.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch the base branch
        run: git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"

      - name: Check file names, placement and PR scope
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: npm run check:format
